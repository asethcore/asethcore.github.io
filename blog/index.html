    <script>
      (function () {
        var t = localStorage.getItem("vaeseth-theme");
        var dark =
          t === "dark" ||
          (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.classList.add("dark");
          var link = document.getElementById("syntax-theme");
          if (link) link.href = link.dataset.dark;
        }
      })();
    </script>
