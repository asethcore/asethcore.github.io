{% extends "base.html" %}
{% block title %}about{% endblock %}
{% block content %}
      <!-- ================= ABOUT ================= -->

      <div class="page">
        <section class="panel about-panel">
          <div class="panel-header">
            <span class="panel-icon">◉</span>
            <span>about</span>
          </div>

          <div class="panel-body about-body">
            <h1 class="about-title">{{ page.title }}</h1>

            <div class="about-grid">
              <div class="about-text">
                {{ page.content | safe }}
              </div>

              {% if page.extra.image %}
              <figure class="about-figure">
                <img
                  src="{{ get_url(path=page.extra.image) }}"
                  alt="this is me"
                  class="about-photo"
                />

                <figcaption>this is me, allegedly</figcaption>
              </figure>
              {% endif %}
            </div>
          </div>
        </section>
      </div>
{% endblock %}
