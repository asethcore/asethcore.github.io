<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}vaeseth{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="{{ get_url(path="styles.css") }}" />
    <link
      rel="stylesheet"
      id="syntax-theme"
      href="{{ get_url(path='giallo-light.css') }}"
      data-light="{{ get_url(path='giallo-light.css') }}"
      data-dark="{{ get_url(path='giallo-dark.css') }}"
    />
    <link rel="icon" type="image/x-icon" href="{{ get_url(path="favicon.ico") }}" />

    <script>
      (function () {
        var t = localStorage.getItem("vaeseth-theme");
        var dark =
          t === "dark" ||
          (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.classList.add("dark");
          var link = document.getElementById("syntax-theme");
          if (link) link.href = link.dataset.dark;
        }
      })();
    </script>

    <script type="text/javascript" src="{{ get_url(path="darkmode.js") }}" defer></script>
    <script type="text/javascript" src="{{ get_url(path="music.js") }}" defer></script>
    <script type="text/javascript" src="{{ get_url(path="micros.js") }}" defer></script>
    <script type="text/javascript" src="{{ get_url(path="code-blocks.js") }}" defer></script>
    <script type="text/javascript" src="{{ get_url(path="shelf.js") }}" defer></script>
    <script type="text/javascript" src="{{ get_url(path="lightbox.js") }}" defer></script>
  </head>

  <body>
    <main class="site">
      <!-- ================= HEADER ================= -->

      {% set current = current_path | default(value="/") %}

      <header class="site-header">
        <nav class="site-nav">
          <a href="{{ get_url(path='@/_index.md') }}" {% if current == "/" %}class="active"{% endif %}>home</a>
          <a href="{{ get_url(path='@/about.md') }}" {% if current == "/about/" %}class="active"{% endif %}>about</a>
          <a href="{{ get_url(path='@/blog/_index.md') }}" {% if current is starting_with("/blog") %}class="active"{% endif %}>posts</a>
          <a href="{{ get_url(path='@/photo.md') }}" {% if current == "/photo/" %}class="active"{% endif %}>photos</a>
          <a href="{{ get_url(path='@/books.md') }}" {% if current == "/books/" %}class="active"{% endif %}>books</a>
        </nav>

        <div class="site-name"><span>vae</span>seth</div>
      </header>

      {% block content %}{% endblock %}

      <!-- ================= FOOTER ================= -->

      <footer class="site-footer">
        <span> © vaeseth </span>

        <div class="footer-links">
          <a href="{{ get_url(path="rss.xml") }}">rss</a>
          <span>|</span>
          <a href="mailto:asethcore@gmail.com">contact</a>
          <span>|</span>
          <a href="https://github.com/asethcore" target="_blank" rel="noopener">github</a>
        </div>
      </footer>
    </main>
  </body>
</html>
