{% extends "base.html" %}
{% block title %}#{{ term.name }}{% endblock %}
{% block content %}
      <div class="page">
        <section class="panel posts-panel">
          <div class="panel-header">
            <span class="panel-icon" aria-hidden="true"></span>
            <span>#{{ term.name }}</span>
          </div>

          <div class="panel-body posts-list">
            {% for page in term.pages %}
            <a href="{{ page.permalink }}" class="recent-item">
              <span class="recent-arrow">›</span>
              <span>{{ page.title }}</span>
              <span class="post-date">{{ page.date | date(format="%b %d, %Y") | lower }}</span>
            </a>
            {% endfor %}
          </div>
        </section>
      </div>
{% endblock %}
